spring.application.name=rc_xizhang_coding
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/notification?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=UTC&connectTimeout=3000&socketTimeout=10000}
spring.datasource.username=${DB_USERNAME:notification}
spring.datasource.password=${DB_PASSWORD:notification-local}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-statement-timeout=5
notification.api-key=${NOTIFICATION_API_KEY}
notification.suppliers.demo.origin=${SUPPLIER_ORIGIN:http://localhost:9090}
notification.suppliers.demo.callback-key=${SUPPLIER_CALLBACK_KEY}
notification.http-timeout=3s
notification.scan-delay-ms=30000
notification.scan-initial-delay-ms=30000
notification.batch-size=100
notification.workers=4
notification.queue-capacity=100
notification.scheduler-enabled=true
