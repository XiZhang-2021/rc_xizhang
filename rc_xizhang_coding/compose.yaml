services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_DATABASE: notification
      MYSQL_USER: notification
      MYSQL_PASSWORD: notification-local
      MYSQL_ROOT_PASSWORD: root-local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - notification_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot-local"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  notification_mysql:
